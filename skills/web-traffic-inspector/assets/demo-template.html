<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__WTI_DOCUMENT_TITLE__</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { max-width: 850px; margin: 36px auto; padding: 0 20px; }
  h1 { line-height: 1.2; }
  form, #fields { display: grid; gap: 14px; }
  label { display: grid; gap: 5px; }
  input, select, textarea, button { font: inherit; padding: 9px; }
  input[type=checkbox] { width: auto; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  :focus-visible { outline: 3px solid Highlight; outline-offset: 2px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 500px; overflow: auto; }
  section, details { margin-top: 24px; }
  #status { min-height: 1.5em; }
  #status[data-error=true] { color: light-dark(#9b2226, #ff9292); }
  #ack-row { display: flex; align-items: baseline; }
  [hidden] { display: none !important; }
</style>
<h1 id="title"></h1>
<p id="summary">Unverified prototype. Complete the action and record its verification in FINDINGS.md.</p>
<form id="form">
  <div id="fields"></div>
  <label id="ack-row" hidden><input id="ack" type="checkbox">This execution can change website state or consume a paid resource.</label>
  <button id="run">Run</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section aria-label="Result"><div id="result"></div></section>
<details>
  <summary>Response evidence</summary>
  <pre id="evidence">No response yet.</pre>
  <button id="copy" disabled>Copy JSON</button>
  <button id="download" disabled>Download JSON</button>
  <span id="utility" role="status"></span>
</details>
<script>
const SPEC = __WTI_DEMO_CONFIG__;
__WTI_DATA_GUARDS__
const el = id => document.getElementById(id);
let busy = false, token = null, evidence = '', hasEvidence = false;
el('title').textContent = SPEC.title;
el('ack-row').hidden = !SPEC.sideEffect;

for (const definition of SPEC.inputs) {
  const label = document.createElement('label');
  label.textContent = definition.label;
  const input = document.createElement(['select','textarea'].includes(definition.type) ? definition.type : 'input');
  if (input.tagName === 'INPUT') input.type = definition.type;
  input.name = definition.name;
  input.required = Boolean(definition.required);
  for (const key of ['placeholder','min','max','step','minLength','maxLength','pattern']) {
    if (definition[key] !== undefined) input[key] = definition[key];
  }
  for (const option of definition.options || []) {
    const item = document.createElement('option'); item.value = option.value; item.textContent = option.label; input.append(item);
  }
  if (definition.value !== undefined) {
    if (definition.type === 'checkbox') input.checked = Boolean(definition.value);
    else input.value = String(definition.value);
  }
  label.append(input); el('fields').append(label);
}
function inputs() {
  return Object.fromEntries(SPEC.inputs.map(definition => {
    const input = el('form').elements.namedItem(definition.name);
    const value = definition.type === 'checkbox' ? input.checked : definition.type === 'number' && input.value !== '' ? Number(input.value) : input.value;
    return [definition.name, value];
  }));
}
function interpolate(value, values) {
  if (Array.isArray(value)) return value.map(item => interpolate(item, values));
  if (value && typeof value === 'object') return Object.fromEntries(Object.entries(value).map(([key,item]) => [key,interpolate(item,values)]));
  if (typeof value !== 'string') return value;
  const exact = value.match(/^\{\{([A-Za-z][A-Za-z0-9_-]*)\}\}$/);
  if (exact) return values[exact[1]];
  return value.replace(/\{\{([A-Za-z][A-Za-z0-9_-]*)\}\}/g, (_,name) => String(values[name] ?? ''));
}
function showEvidence(value) {
  evidence = safeJson(value); hasEvidence = true;
  el('evidence').textContent = evidence;
  el('copy').disabled = el('download').disabled = false;
}
function sync() { el('run').disabled = busy || (SPEC.sideEffect && !el('ack').checked); }
el('ack').addEventListener('change', sync);

async function request(stage, values) {
  const acknowledged = !SPEC.sideEffect || el('ack').checked;
  if (!acknowledged) throw new Error('Acknowledge this execution first.');
  el('ack').checked = false; sync();
  let result;
  if (SPEC.mode === 'direct') {
    const definition = Object.hasOwn(SPEC.requests, stage) ? SPEC.requests[stage] : null;
    if (!definition) throw new Error('Unknown fixed operation.');
    const operation = interpolate(definition, values);
    const url = new URL(operation.url);
    for (const [key,value] of Object.entries(operation.query || {})) if (value !== '' && value != null) url.searchParams.set(key,String(value));
    const headers = {...operation.headers};
    let body;
    if (operation.body !== undefined) {
      body = typeof operation.body === 'string' ? operation.body : JSON.stringify(operation.body);
      if (!Object.keys(headers).some(key => key.toLowerCase() === 'content-type')) headers['Content-Type'] = 'application/json';
    }
    result = await responseData(await fetch(url, {method:operation.method, headers, body, credentials:operation.credentials || 'omit', redirect:'manual'}));
  } else {
    if (!token) {
      const config = await fetch('/__wti/config', {cache:'no-store'});
      if (!config.ok) throw new Error('Start the local companion and reload this page.');
      token = (await config.json()).requestToken;
    }
    const response = await fetch('/__wti/execute', {method:'POST', headers:{'Content-Type':'application/json','X-WTI-Token':token}, body:JSON.stringify({inputs:values,requestKey:stage,acknowledged})});
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || 'Companion request failed.');
    if (payload.truncated) {
      showEvidence(payload);
      throw new Error('The response exceeded the output limit. Inspect the preview and narrow the result in the companion.');
    }
    result = payload.response;
  }
  showEvidence({stage, response:result});
  if (!result.ok) throw new Error(`The operation returned HTTP ${result.status}.`);
  return result;
}

// WTI-ACTION: tailor this action to the observed website. HTTP success alone is insufficient.
async function action(values) {
  const response = await request('main', values);
  throw new Error('WTI_ACTION_REQUIRED: check the expected domain result and return only the useful fields.');
}
function render(result) {
  const pre = document.createElement('pre'); pre.textContent = safeJson(result); el('result').replaceChildren(pre);
}

// Use this wrapper for every user-triggered action, including selection/detail buttons.
async function runAction(work) {
  if (busy) return;
  busy = true; sync(); hasEvidence = false; evidence = '';
  el('copy').disabled = el('download').disabled = true;
  el('evidence').textContent = 'Waiting for a response…'; el('utility').textContent = '';
  el('result').replaceChildren(); el('result').setAttribute('aria-busy','true');
  el('status').dataset.error = 'false'; el('status').textContent = 'Running…';
  try {
    const result = await work();
    if (result === undefined) throw new Error('The action returned no result.');
    render(result); el('status').textContent = 'Completed.';
  } catch (error) {
    const message = safeData(String(error.message || error));
    if (!hasEvidence) showEvidence({error:message});
    el('status').dataset.error = 'true'; el('status').textContent = message;
  } finally { busy = false; el('result').setAttribute('aria-busy','false'); sync(); }
}
el('form').addEventListener('submit', event => { event.preventDefault(); if (el('form').reportValidity()) runAction(() => action(inputs())); });
el('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(evidence); el('utility').textContent = 'Copied'; }
  catch { el('utility').textContent = 'Select the response above to copy it manually.'; }
});
el('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([evidence],{type:'application/json'}));
  const link = document.createElement('a'); link.href = url; link.download = 'response.json'; link.click();
  el('utility').textContent = 'Download started'; setTimeout(() => URL.revokeObjectURL(url),1000);
});
sync();
</script>
</html>
